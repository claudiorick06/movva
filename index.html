<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="indexstyle.css">

    <link rel="icon" href="images/logo.png" type="image/png"> <!-- Fazer uma logo depois -->
</head>

<body>

    <div class="login-card">
        <!-- Logo e Título -->
        <div class="text-center mb-4">
            <img src="./images/logo.png" alt="Movvi Logo" class="brand-logo-img mb-2">
            <p class="small mb-0" style="color: var(--text-muted);">Painel Operacional de Locação</p>
        </div>

        <!-- Alerta de Erro de Login (Invisível por padrão) -->
        <div id="alert-erro" class="alert alert-danger d-none py-2 small text-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuário ou senha incorretos!
        </div>

        <!-- Formulário de Autenticação -->
        <form id="form-login" onsubmit="validarLogin(event)">
            <div class="mb-3">
                <label for="usuario" class="form-label small" style="color: var(--text-muted);">Usuário / CPF</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" class="form-control" id="usuario" placeholder="Digite seu usuário" required
                        autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label small" style="color: var(--text-muted);">Senha</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-orange w-100">
                Entrar no Sistema <i class="bi bi-arrow-right-short ms-1"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <span style="font-size: 0.75rem; color: var(--text-muted);">Movvi Fleet System v1.0</span>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Inline de Autenticação Front-end (root / 0000) -->
    <script>
        function validarLogin(event) {
            // Impede o envio padrão do formulário
            event.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const alertErro = document.getElementById('alert-erro');

            // Validação estática: root / 0000
            if (usuario === 'root' && senha === '0000') {
                alertErro.classList.add('d-none');

                // Simulação de sucesso e direcionamento para a dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Exibe a mensagem de erro na tela
                alertErro.classList.remove('d-none');
            }
        }
    </script>
</body>

</html>
